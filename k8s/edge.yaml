# Public HTTPS edge for the cluster: Caddy + Let's Encrypt on the reserved static IP.
# APPROVED by the user 2026-10-09 ("approve the IP-restricted public edge").
#
# Every host answers ONLY Netcup (159.195.108.208), where the Moyai control plane runs;
# anyone else gets 403. ate-api has no RBAC yet (any authenticated caller has full control),
# so the IP allowlist AND the bearer token are both required. Port 80/443 must stay open to
# the internet for Let's Encrypt, so the allowlist lives in Caddy, not in the LB.
#
# Before applying: create ConfigMap edge/ate-api-ca from the Substrate service trust bundle
# (see rebuild.sh) so Caddy can verify api.ate-system.svc.
apiVersion: v1
kind: Namespace
metadata: {name: edge}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: caddy, namespace: edge}
data:
  Caddyfile: |
    {
      email founder@ai-agentic-enterprises.com
    }
    (netcup_only) {
      @netcup remote_ip 159.195.108.208
    }
    litellm.ai-agentic-enterprises.com {
      import netcup_only
      handle @netcup {
        reverse_proxy litellm.litellm.svc:4000 {
          flush_interval -1
        }
      }
      handle {
        respond "Forbidden" 403
      }
    }
    substrate-api.ai-agentic-enterprises.com {
      import netcup_only
      handle @netcup {
        reverse_proxy https://api.ate-system.svc:443 {
          transport http {
            versions 2
            tls_server_name api.ate-system.svc
            tls_trusted_ca_certs /ate-ca/ca.crt
          }
        }
      }
      handle {
        respond "Forbidden" 403
      }
    }
    substrate-router.ai-agentic-enterprises.com {
      import netcup_only
      handle @netcup {
        reverse_proxy atenet-router.ate-system.svc:80 {
          flush_interval -1
          transport http {
            response_header_timeout 600s
          }
        }
      }
      handle {
        respond "Forbidden" 403
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: caddy-data, namespace: edge}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: caddy, namespace: edge}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: caddy}}
  template:
    metadata: {labels: {app: caddy}}
    spec:
      containers:
      - name: caddy
        image: caddy:2.10-alpine
        ports: [{containerPort: 80}, {containerPort: 443}]
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
        volumeMounts:
        - {name: config, mountPath: /etc/caddy}
        - {name: data, mountPath: /data}
        - {name: ate-ca, mountPath: /ate-ca}
      volumes:
      - {name: config, configMap: {name: caddy}}
      - {name: data, persistentVolumeClaim: {claimName: caddy-data}}
      - {name: ate-ca, configMap: {name: ate-api-ca}}
---
apiVersion: v1
kind: Service
metadata: {name: caddy, namespace: edge}
spec:
  type: LoadBalancer
  loadBalancerIP: 34.24.90.102
  externalTrafficPolicy: Local
  selector: {app: caddy}
  ports: [{name: http, port: 80}, {name: https, port: 443}]
